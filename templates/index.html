<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimata Matrix Chatten</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #121212;
            color: white;
            min-height: 100vh;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            z-index: -1;
            opacity: 0.6;
        }

        #chat-header {
            font-size: clamp(1.7rem, 6vw, 2.5rem);
            letter-spacing: 5px;
            color: #00ff00;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ff00, 0 0 15px #00ff00;
            margin-top: 20px;
            margin-bottom: 20px;
            animation: flicker 2s infinite alternate;
            z-index: 1;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 5px #00ff00, 0 0 15px #00ff00;
            }

            20%, 24%, 55% {
                text-shadow: none;
                color: #003300;
            }
        }

        #chat {
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            width: min(100% - 24px, 500px);
            height: min(58vh, 450px);
            overflow-y: scroll;
            background: rgba(18, 18, 18, 0.9);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            z-index: 1;
            box-sizing: border-box;
        }

        #chat::-webkit-scrollbar {
            width: 10px;
        }

        #chat::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 8px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #333;
            border: 2px solid #121212;
            border-radius: 8px;
        }

        #chat::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        .msg-line {
            display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
            padding-bottom: 4px;
            font-size: 0.85em;
        }

        .time-label {
            color: #888;
            font-size: 0.8em;
            margin-right: 8px;
            white-space: nowrap;
        }

        .user-label {
            color: #00ff00;
            font-weight: bold;
            margin-right: 8px;
            white-space: nowrap;
        }

        .msg-content {
            flex: 1;
            word-break: break-word;
            color: #e0e0e0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(100% - 24px, 530px);
            z-index: 1;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            gap: 12px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 20, 0, 0.7);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 4px;
            padding: 4px 12px;
            margin-bottom: 8px;
            min-width: 0;
        }

        #username {
            background: transparent;
            color: #00ff00;
            border: none;
            font-weight: bold;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            outline: none;
            width: 100%;
            text-transform: uppercase;
            cursor: default;
            padding: 0;
            margin: 0;
            letter-spacing: 1px;
        }

        #digital-clock {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        #user_input {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff00;
            color: #ffffff;
            padding: 18px;
            border-radius: 8px;
            flex: 1;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
            transition: all 0.3s ease;
            min-width: 0;
        }

        #user_input:focus {
            background: rgba(0, 5, 0, 0.95);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            transform: translateY(-2px);
        }

        #user_input::placeholder {
            color: rgba(0, 255, 0, 0.4);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .send-btn {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 0 30px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            box-shadow: 0 0 5px #00ff00;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 25px #00ff00;
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .clear-btn {
            background: #000;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 8px 15px;
            font-size: 0.75em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 3px #ff4444;
            margin-top: 20px;
            opacity: 0.8;
        }

        .clear-btn:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 15px #ff4444;
            opacity: 1;
        }

        .clear-btn:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #000;
            margin: 15% auto;
            padding: 30px;
            border: 2px solid #ff4444;
            box-shadow: 0 0 20px #ff4444;
            width: 350px;
            text-align: center;
            color: #ff4444;
            font-family: 'Courier New', monospace;
        }

        .modal-content h3 {
            animation: alert-flicker 1s infinite;
        }

        @keyframes alert-flicker {
            0% {
                opacity: 1;
                text-shadow: 0 0 10px #ff4444;
            }

            50% {
                opacity: 0.5;
                text-shadow: none;
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 10px #ff4444;
            }
        }

        .modal-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: space-around;
            gap: 12px;
        }

        .confirm-btn,
        .cancel-btn {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ff4444;
            background: transparent;
            color: #ff4444;
        }

        .confirm-btn:hover {
            background: #ff4444;
            color: #000;
        }

        .cancel-btn {
            border-color: #888;
            color: #888;
        }

        .cancel-btn:hover {
            background: #444;
            color: #fff;
        }

        .self-label {
            color: #fff !important;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            font-weight: 900;
            letter-spacing: 1px;
        }

        @media (max-width: 560px) {
            .top-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .input-group {
                flex-direction: column;
                gap: 10px;
            }

            .send-btn {
                width: 100%;
                height: 52px;
            }

            .modal-content {
                width: min(100% - 48px, 350px);
                box-sizing: border-box;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="matrix-rain"></div>

    <h2 id="chat-header">MATRIX CHATT</h2>

    <div id="chat"></div>

    <div class="controls">
        <div class="top-row">
            <div class="user-badge">
                <input id="username" type="text" value="{{ username }}" readonly>
            </div>
            <div id="digital-clock">00:00:00</div>
        </div>

        <div class="input-group">
            <input id="user_input" type="text" placeholder="Skriv ett meddelande..." autofocus>
            <button class="send-btn" onclick="sendMessage()">Skicka</button>
        </div>

        <button class="clear-btn" onclick="clearChat()">Rensa chatten för alla</button>
    </div>

    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ff4444; margin-top: 0;">SYSTEM VARNING</h3>
            <p>Är du säker på att du vill radera all chatthistorik?</p>
            <div class="modal-buttons">
                <button class="confirm-btn" onclick="executeClear()">Bekräfta</button>
                <button class="cancel-btn" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <script>
        var socket = io();
        var notificationSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        var warningSound = new Audio('/static/alarm.mp3');
        warningSound.loop = true;

        function addMessage(data) {
            var chatDiv = document.getElementById('chat');
            var item = document.createElement('div');
            item.className = 'msg-line';

            var currentUserName = document.getElementById('username').value;

            var timeLabel = document.createElement('span');
            timeLabel.className = 'time-label';
            timeLabel.textContent = `[${data.time || '--:--'}]`;

            var userLabel = document.createElement('span');
            userLabel.className = (data.user === currentUserName) ? 'user-label self-label' : 'user-label';
            userLabel.textContent = `${data.user}:`;

            var messageContent = document.createElement('span');
            messageContent.className = 'msg-content';
            messageContent.textContent = data.msg || '';

            item.appendChild(timeLabel);
            item.appendChild(userLabel);
            item.appendChild(messageContent);

            chatDiv.appendChild(item);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        socket.on('history', function(history) {
            document.getElementById('chat').innerHTML = '';
            history.forEach(addMessage);
        });

        socket.on('message', function(data) {
            addMessage(data);
            notificationSound.play().catch(() => {});
        });

        socket.on('chat_cleared', function() {
            document.getElementById('chat').innerHTML = '';
        });

        function sendMessage() {
            var msgInput = document.getElementById('user_input');

            if (msgInput.value.trim() !== '') {
                socket.emit('message', {
                    msg: msgInput.value
                });

                msgInput.value = '';
            }
        }

        function clearChat() {
            warningSound.play().catch(function(error) {
                console.log('Ljudet kunde inte spelas: ', error);
            });

            document.getElementById('custom-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';

            warningSound.pause();
            warningSound.currentTime = 0;
        }

        function executeClear() {
            socket.emit('clear_chat');
            closeModal();
        }

        document.getElementById('user_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('digital-clock').textContent = `${h}:${m}:${s}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        const matrixContainer = document.getElementById('matrix-rain');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        matrixContainer.appendChild(canvas);

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const fontSize = 16;
        let columns = Math.floor(width / fontSize);
        let drops = Array(columns).fill(1);
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';

        function draw() {
            ctx.fillStyle = 'rgba(18, 18, 18, 0.05)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', function() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / fontSize);
            drops = Array(columns).fill(1);
        });
    </script>
</body>
</html>
